<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dandy Engines</title>
<meta name="theme-color" content="#0C0D0F">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/logo.webp">
<link rel="apple-touch-icon" href="/logo.webp">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <img src="/logo.webp" alt="Dandy Engines" class="login-logo">
    <p class="login-tag">Workshop Job Flow &amp; Priority System</p>
    <form id="login-form" autocomplete="off">
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" autofocus>
      <button type="submit">Enter</button>
    </form>
    <p id="login-error" class="login-error" hidden></p>
  </div>
</div>

<!-- ===== APP SHELL (hidden until logged in) ===== -->
<div id="app" class="app" hidden>

  <!-- Desktop/tablet sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="/logo.webp" alt="Dandy Engines" class="sidebar-logo">
    </div>
    <div class="sidebar-tabs" id="sidebar-tabs"></div>
    <div class="sidebar-user" id="sidebar-user"></div>
  </nav>

  <!-- Main content -->
  <main class="main">
    <header class="topbar">
      <button id="search-btn" class="icon-btn" aria-label="Search">🔍</button>
      <h1 id="page-title">Home</h1>
      <div class="topbar-user-info">
        <span id="topbar-user" class="topbar-user"></span>
        <button id="alerts-indicator" class="icon-btn" aria-label="Alerts status" title="Alerts">🔕</button>
      </div>
      <button id="settings-shortcut" class="icon-btn" aria-label="Settings">⚙️</button>
    </header>

    <div id="content" class="content">
      <!-- Stage 1: placeholder screens per tab. Real tab content arrives in later stages. -->
    </div>
  </main>

  <!-- Phone bottom tab bar -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Phone: swipe-up (or tap) sheet showing every tab -->
  <div id="tab-sheet-overlay" class="tab-sheet-overlay" hidden>
    <div class="tab-sheet">
      <div class="tab-sheet-grip"></div>
      <div id="tab-sheet-grid" class="tab-sheet-grid"></div>
    </div>
  </div>

  <!-- Master search popup (hidden until opened) -->
  <div id="search-overlay" class="search-overlay" hidden>
    <div class="search-bubble">
      <input type="text" id="search-bubble-input" placeholder="Search everything…" autocomplete="off">
      <button id="search-bubble-close" class="icon-btn" aria-label="Close search">✕</button>
      <div id="search-bubble-results" class="search-bubble-results"></div>
    </div>
  </div>

  <!-- Generic modal (used for New Job / New Machining Job popups) -->
  <div id="modal-overlay" class="search-overlay" hidden>
    <div class="modal-card" id="modal-card"></div>
  </div>

  <!-- App-wide Undo toast -->
  <div id="undo-toast" class="undo-toast" hidden>
    <span id="undo-toast-msg"></span>
    <button id="undo-toast-btn" class="btn-primary">Undo</button>
  </div>
</div>

<script src="/jobs.js"></script>
<script src="/modal.js"></script>
<script src="/undo.js"></script>
<script src="/home.js"></script>
<script src="/myjobs.js"></script>
<script src="/alljobs.js"></script>
<script src="/allmachining.js"></script>
<script src="/tunnelvision.js"></script>
<script src="/rottler.js"></script>
<script src="/balancing.js"></script>
<script src="/partpayments.js"></script>
<script src="/history.js"></script>
<script src="/permissions-ui.js"></script>
<script src="/tab-order-ui.js"></script>
<script src="/machining.js"></script>
<script src="/alerts.js"></script>
<script src="/search.js"></script>
<script src="/app.js"></script>
</body>
</html>
